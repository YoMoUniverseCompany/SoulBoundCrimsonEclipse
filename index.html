<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulBound Crimson Eclipse | Official Site</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Genshin Style Live Video Background -->
    <div class="hero-container">
        <video autoplay muted loop id="bg-video">
            <!-- HQ Live Cinematic Loop -->
            <source src="https://assets.mixkit.co/videos/preview/mixkit-dramatic-sunset-over-a-mountain-landscape-42900-large.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>

        <!-- Top Navbar -->
        <nav class="navbar">
            <div class="nav-left">
                <div class="logo">YO UNIVERSE</div>
                <div class="nav-links">
                    <a href="#home" class="active">HOME</a>
                    <a href="#news">NEWS</a>
                    <a href="#characters">CHARACTERS</a>
                    <a href="#explore">EXPLORE</a>
                </div>
            </div>
            <div class="nav-right">
                <a href="#" class="btn-download"><i class="fas fa-download"></i> Download</a>
            </div>
        </nav>

        <!-- Center Play Button (Genshin Trailer/Sound style) -->
        <div class="hero-center">
            <div class="play-btn-wrapper">
                <button class="play-btn"><i class="fas fa-play"></i></button>
            </div>
            <p class="hero-subtitle">SOULBOUND CRIMSON ECLIPSE</p>
            <h2 class="hero-status">Bound By Fate. Eclipse The Darkness.</h2>

            <!-- Store Badges Bar (Genshin Style) -->
            <div class="download-badges">
                <div class="badge-card"><i class="fab fa-playstation"></i><span>PS5 | PS4</span></div>
                <div class="badge-card"><i class="fab fa-windows"></i><span>PC Download</span></div>
                <div class="badge-card"><i class="fab fa-xbox"></i><span>Xbox Series X|S</span></div>
                <div class="badge-card"><i class="fab fa-google-play"></i><span>Google Play</span></div>
                <div class="badge-card"><i class="fab fa-apple"></i><span>App Store</span></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
